name: Shopee backend validation
on:
  push:
    paths:
      - "vendor/shopee-br-affiliate-mcp/**"
      - ".github/workflows/shopee-backend.yml"
  pull_request:
    paths:
      - "vendor/shopee-br-affiliate-mcp/**"
      - ".github/workflows/shopee-backend.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: vendor/shopee-br-affiliate-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -c requirements.lock .
      - run: python -m pip check
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src:tests
      - run: python local_test.py --fixture --extended

      - name: Run dashboard integration tests
        working-directory: .
        run: python -m unittest discover -s tests -v
        env:
          SHOPEE_MODE: fixture
